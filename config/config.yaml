# ==========================================
# 路面多模态协同异常检测 (MoME) 全局配置
# 版本: v3.2 (坐标复位至 [-8.0, 0.0] 版)
# ==========================================

# 1. 路径管理
# ------------------------------------------
paths:
  raw_pcd_dir: "C:/Users/31078/Desktop/Road_Project/data/RSRD-sparse1"
  raw_img_dir: "C:/Users/31078/Desktop/Road_Project/data/RSRD-sparse1"
  output_dir: "C:/Users/31078/Desktop/ROAD/data/frame_packages_full"
  
  log_dir: "C:/Users/31078/Desktop/ROAD/logs"
  checkpoint_dir: "C:/Users/31078/Desktop/ROAD/pretrained_models"
  vis_output_dir: "C:/Users/31078/Desktop/ROAD/data/inference_vis_full"
  
  weights:
    point_mae: "C:/Users/31078/Desktop/ROAD/pretrained_models/pretrain.pth"
    dinov2: "C:/Users/31078/Desktop/ROAD/pretrained_models/dinov2_vitb14_pretrain.pth"
    mome_model: "C:/Users/31078/Desktop/ROAD/pretrained_models/mome_model_best.pth"

# 2. 预处理配置
# ------------------------------------------
preprocess:
  inference_batch_size: 8      
  num_workers: 0               
  skip_existing: true          

# 3. 训练与实验管理
# ------------------------------------------
train:
  experiment_name: "MoME_v2_Baseline_Y8" # 增加后缀以区分新的 ROI 范围
  seed: 42                            
  epochs: 50
  batch_size: 32
  lr: 0.0001
  pos_weight: 5.0                     
  val_split: 0.2
  modal_mask_prob: 0.3                

  resume: false                       
  resume_path: "C:/Users/31078/Desktop/ROAD/pretrained_models/mome_model_best.pth"

  save_best: true
  best_model_name: "mome_model_best.pth"
  use_tensorboard: true
  sanity_check:
    ignore_corrupt: true
    min_patch_count: 5

# 4. 特征维度与几何参数 (校准 ROI_Y 为 [-8.0, 0])
# ------------------------------------------
features:
  phys: { key_name: "phys_8d", input_dim: 8 }
  3d:   { key_name: "deep_512d", input_dim: 384 }
  2d:   { key_name: "deep_2d_768d", input_dim: 768 }

geometry:
  roi_x: [-3.0, 3.0]
  roi_y: [-8.0, 0.0]       # 💡 已根据要求复位
  roi_z: [-1.0, 1.0]
  patch_size: 1.0
  overlap: 0.2
  th_anomaly: 0.035
  sigma_q: 0.015

sampling:
  n_points: 8192
  k_z_stretch: 10.0
  trans_dim: 384

# 5. 推理控制
# ------------------------------------------
inference:
  mode: "random" 
  batch_limit: 50
  random_count: 20
  select_files: [] 
  save_plots: true
  show_plots: false