# ==========================================
# 路面多模态协同异常检测 (MoME) 全局配置
# 版本: v2.9 (多模式推理与筛选增强版)
# ==========================================

# 1. 路径管理 (保持不变)
# ------------------------------------------
paths:
  raw_pcd_dir: "C:/Users/31078/Desktop/Road_Project/data/RSRD-sparse1"
  raw_img_dir: "C:/Users/31078/Desktop/Road_Project/data/RSRD-sparse1"
  output_dir: "C:/Users/31078/Desktop/ROAD/data/frame_packages_full"
  log_dir: "C:/Users/31078/Desktop/ROAD/logs"
  checkpoint_dir: "C:/Users/31078/Desktop/ROAD/pretrained_models"
  vis_output_dir: "C:/Users/31078/Desktop/ROAD/data/inference_vis_full"
  
  weights:
    point_mae: "C:/Users/31078/Desktop/ROAD/pretrained_models/pretrain.pth"
    dinov2: "C:/Users/31078/Desktop/ROAD/pretrained_models/dinov2_vitb14_pretrain.pth"
    mome_model: "C:/Users/31078/Desktop/ROAD/pretrained_models/mome_model_best.pth"

# 2. 推理控制 (核心升级：自定义选择模式)
# ------------------------------------------
inference:
  # 选择模式: 
  # "all" - 全部处理
  # "limit" - 处理前 N 个 (batch_limit)
  # "random" - 随机抽取 N 个 (random_count)
  # "specific" - 仅处理指定的特定文件名 (select_files)
  mode: "random" 
  
  batch_limit: 50
  random_count: 20
  
  # 当 mode 为 "specific" 时生效，填写文件名关键词或全名（不带.npz）
  select_files: 
    - "20230317074844.400"
    - "20230317074910.100"
    - "20230317075022.300"

  save_plots: true
  show_plots: false

# 3. 训练、特征、采样等参数 (保持之前版本)
# ------------------------------------------
preprocess: { inference_batch_size: 8, num_workers: 0, skip_existing: true }
train:
  epochs: 50
  batch_size: 32
  lr: 0.0001
  pos_weight: 5.0
  val_split: 0.2
  save_best: true
  use_tensorboard: true
  sanity_check: { ignore_corrupt: true, min_patch_count: 5 }

features:
  phys: { key_name: "phys_8d", input_dim: 8 }
  3d:   { key_name: "deep_512d", input_dim: 384 }
  2d:   { key_name: "deep_2d_768d", input_dim: 768 }

geometry:
  roi_x: [-3.0, 3.0]
  roi_y: [-8.0, 0]
  roi_z: [-1.0, 1.0]
  patch_size: 1.0
  overlap: 0.2
  th_anomaly: 0.035
  sigma_q: 0.015

sampling: { n_points: 8192, k_z_stretch: 10.0, trans_dim: 384 }